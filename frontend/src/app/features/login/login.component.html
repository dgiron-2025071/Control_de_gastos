<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-eyebrow">Control-Gastos</span>
      <h1 class="auth-title">Bienvenido</h1>
      <p class="auth-subtitle">Inicia sesión para continuar</p>
    </div>

    <div class="auth-body">
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="tucorreo@email.com"
          />
          @if (email.touched && email.invalid) {
            <span class="field-error">Ingresa un correo válido.</span>
          }
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
          @if (password.touched && password.invalid) {
            <span class="field-error">La contraseña es obligatoria.</span>
          }
        </div>

        @if (errorMessage()) {
          <div class="alert-error">{{ errorMessage() }}</div>
        }

        <button type="submit" class="btn-primary" [disabled]="loading()">
          @if (loading()) {
            Ingresando...
          } @else {
            Iniciar sesión
          }
        </button>

        <button type="button" class="btn-secondary" routerLink="/register">
          Registrarse
        </button>
      </form>
    </div>
  </div>
</div>
